name: CI - Laravel Tests + Build

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: admin-starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI (Laravel tests + frontend build)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing_root
          MYSQL_DATABASE: admin_starter_test
          MYSQL_USER: admin_user
          MYSQL_PASSWORD: admin_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptesting_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd, zip, intl, redis
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's|^APP_ENV=.*|APP_ENV=testing|' .env
          sed -i 's|^APP_DEBUG=.*|APP_DEBUG=false|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=admin_starter_test|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=admin_user|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=admin_secret|' .env

      - name: Build frontend assets
        run: npm run build

      - name: Run backend tests
        run: |
          php artisan migrate --force
          php artisan test

      - name: Run code style check (optional)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Validate Docker compose file
        run: |
          docker compose config --quiet
          docker compose --profile local-infra --profile workers config --quiet
