name: CD - Build and Deploy

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

concurrency:
  group: admin-starter-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image tags
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_LC}/${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (optional - customize for your needs)
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_PATH }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # Use sudo for docker only when the SSH user lacks direct socket access.
            if docker info >/dev/null 2>&1; then
              DOCKER="docker"
            elif sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            else
              echo "Docker access failed for this SSH user."
              echo "Fix on server: sudo usermod -aG docker $USER && newgrp docker"
              exit 1
            fi

            # Deploy with the base compose file only. This avoids loading
            # docker-compose.override.yml (dev-only services such as vite).
            COMPOSE="$DOCKER compose -f docker-compose.yml"

            # Optional: login for private GHCR images.
            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | $DOCKER login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            # App images are built in GitHub Actions and pulled on server.
            export APP_IMAGE="${{ steps.image.outputs.name }}"
            export APP_IMAGE_TAG="${{ steps.image.outputs.tag }}"

            # Pull images and start app+nginx with local db.
            $COMPOSE --profile local-infra pull admin_app nginx mysql redis

            # Start containers. Entrypoint waits for DB readiness internally.
            $COMPOSE --profile local-infra up -d --no-build --remove-orphans

            # Give DB time to pass healthcheck before running migrations.
            echo "Waiting for database to become healthy..."
            sleep 30

            $COMPOSE ps

            # Run migrations.
            $COMPOSE exec -T admin_app php artisan migrate --force

            $DOCKER image prune -f

            echo "Deploy finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

# Required GitHub repository secrets for deployment:
# EC2_HOST            -> public IP or hostname of server
# EC2_USERNAME        -> SSH user (ubuntu/ec2-user)
# EC2_SSH_PRIVATE_KEY -> private key content (PEM)
# EC2_APP_PATH        -> absolute app path on server (example: /var/www/admin-starter-laravel12)
# Optional:
# EC2_SSH_PORT        -> defaults to 22
# GHCR_USERNAME       -> required only when GHCR package is private
# GHCR_PAT            -> required only when GHCR package is private (read:packages)
